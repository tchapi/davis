# This is a very simple / naive configuration for nginx + Davis
#
# USE HTTPS IN PRODUCTION
#

upstream docker-davis {
    server davis:9000;
}

server {
    listen 80;
    access_log off;

    root /var/www/davis/public/;
    index index.php;

    charset utf-8;

    # Security headers (add `Strict-Transport-Security` once TLS is terminated in front of nginx)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    server_tokens off;

    location ~ /(\.ht) {
        deny all;
        return 404;
    }

    # Every URL Davis emits for these carries a `?<version>` that changes with the release, so a
    # stale copy can never be served: a new release is a new URL
    location ~* \.(css|js|png|jpe?g|gif|svg|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;

        # An `add_header` here replaces the whole inherited set, so the server-level headers above
        # have to be repeated or static files would be served without them
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location ~ ^(.+\.php)(.*)$ {
        try_files       $fastcgi_script_name =404;
        include         fastcgi_params;
        fastcgi_pass    docker-davis;
        fastcgi_param   SCRIPT_FILENAME  $document_root$fastcgi_script_name;
        fastcgi_param   PATH_INFO        $fastcgi_path_info;
        fastcgi_split_path_info  ^(.+\.php)(.*)$;
    }
}
