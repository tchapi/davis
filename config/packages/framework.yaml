# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'
    handle_all_throwables: true
    #csrf_protection: true
    http_method_override: false

    # Enables session support. Note that the session will ONLY be started if you read or write from it.
    # Remove or comment this section to explicitly disable session support.
    session:
        handler_id: null
        cookie_secure: auto
        cookie_samesite: lax
        name: 'DAVIS_SESSION'
        storage_factory_id: session.storage.factory.native

    # The CSS and JS only ever change with a release, so the version is the release. It also makes
    # `asset()` prepend the base path, which a hard-coded `/css/…` does not on a sub-directory install.
    assets:
        version: !php/const App\Version::VERSION

    property_info:
        with_constructor_extractor: false

    php_errors:
        log: true
